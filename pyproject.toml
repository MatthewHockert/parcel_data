[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parceldata"
version = "1.0.0"
description = "Read the Twin Cities regional parcels, 2005-2025 (MetroGIS 7-county files, standardized GeoParquet on Zenodo)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Matthew Hockert" }]
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "geopandas",
    "matplotlib",
    "pyarrow",
    "pyogrio",
    "shapely>=2.1",
]

[project.urls]
Homepage = "https://github.com/MatthewHockert/parcel_data"

[tool.hatch.build.targets.sdist]
only-include = ["python/parceldata", "inst/extdata", "README.md", "LICENSE", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["python/parceldata"]

[tool.hatch.build.targets.wheel.force-include]
"inst/extdata" = "parceldata/extdata"
